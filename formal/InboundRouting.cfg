\* Bounds for formal/InboundRouting.tla: two sessions carrying the alias, one alias message, one message to
\* session a's exact id. MaxNotify = MAX_NOTIFY, so one session can spend its whole pointer budget.
CONSTANTS
  Sessions = {a, b}
  AliasMsgs = {m1}
  ExactMsgs = {m2}
  ExactTo = a
  Null = Null
  MaxNotify = 3
  MaxFaults = 1

SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Routed NoSteal
