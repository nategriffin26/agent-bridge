\* Bounds for formal/InboundWake.tla. MaxFaults must stay below MaxNotify: the design re-points a message at
\* most MAX_NOTIFY times, so MaxNotify lost pointers to one message silence it by design, not by bug.
CONSTANTS
  Msgs = {m1, m2}
  MaxNotify = 3
  MaxFaults = 2

SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Woken
